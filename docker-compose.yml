services:
  app:
    build:
      context: .
      dockerfile: docker/frankenphp/Dockerfile
    image: '${APP_SLUG:-agent-ready-laravel}-frankenphp'
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: frankenphp run --config /etc/caddy/Caddyfile
    environment:
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      XDG_CONFIG_HOME: /tmp/caddy-config
      XDG_DATA_HOME: /tmp/caddy-data
      IGNITION_LOCAL_SITES_PATH: /app
    volumes:
      - '.:/app'
      - './docker/frankenphp/Caddyfile:/etc/caddy/Caddyfile:ro'
    networks:
      - default
      - shared-services

  vite:
    image: node:24-alpine
    user: '${APP_UID:-1000}:${APP_GID:-1000}'
    working_dir: /app
    command: npm run dev -- --host 0.0.0.0 --port 5173
    environment:
      npm_config_cache: /tmp/npm-cache
      VITE_DOMAIN: '${VITE_DOMAIN:-vite.app.localhost}'
    volumes:
      - '.:/app'
    networks:
      - default

  pgsql:
    profiles:
      - shared
    image: postgres:16
    restart: unless-stopped
    container_name: '${SHARED_PGSQL_CONTAINER:-agent-ready-laravel-pgsql}'
    ports:
      - '${FORWARD_DB_PORT:-54320}:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: '${DB_USERNAME:-sail}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'shared-pgsql:/var/lib/postgresql/data'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sail} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      shared-services:
        aliases:
          - pgsql

  redis:
    profiles:
      - shared
    image: redis:7-alpine
    restart: unless-stopped
    container_name: '${SHARED_REDIS_CONTAINER:-agent-ready-laravel-redis}'
    ports:
      - '${FORWARD_REDIS_PORT:-63790}:6379'
    volumes:
      - 'shared-redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      shared-services:
        aliases:
          - redis

  mailpit:
    profiles:
      - shared
    image: axllent/mailpit:latest
    restart: unless-stopped
    container_name: '${SHARED_MAILPIT_CONTAINER:-agent-ready-laravel-mailpit}'
    ports:
      - '${FORWARD_MAILPIT_SMTP_PORT:-10250}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      shared-services:
        aliases:
          - mailpit

networks:
  default:
    driver: bridge
  shared-services:
    name: '${SHARED_SERVICES_NETWORK:-agent-ready-laravel-shared}'
    external: true

volumes:
  shared-pgsql:
    name: agent-ready-laravel-pgsql-data
  shared-redis:
    name: agent-ready-laravel-redis-data
