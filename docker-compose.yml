services:
  laravel.test:
    build:
      context: ./vendor/laravel/sail/runtimes/8.5
      dockerfile: Dockerfile
      args:
        WWWGROUP: '${WWWGROUP}'
    image: sail-8.5/app
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # AGENT_READY_OPTIONAL_HOST_VITE:
    # Uncomment this block if you want to run Vite on the host and proxy it
    # through shared Traefik file-provider routes instead of routing to the
    # containerized Vite server with Docker labels.
    # ports:
    #   - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
    environment:
      WWWUSER: '${WWWUSER}'
      LARAVEL_SAIL: 1
      XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
      XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
      IGNITION_LOCAL_SITES_PATH: '${PWD}'
      VITE_PORT: '${VITE_PORT:-5173}'
    volumes:
      - '.:/var/www/html'
    networks:
      - default
      - shared-services

  pgsql:
    profiles:
      - shared
    image: postgres:16
    restart: unless-stopped
    container_name: '${SHARED_PGSQL_CONTAINER:-agent-ready-laravel-pgsql}'
    ports:
      - '${FORWARD_DB_PORT:-54320}:5432'
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: '${DB_USERNAME:-sail}'
      POSTGRES_PASSWORD: '${DB_PASSWORD:-password}'
    volumes:
      - 'shared-pgsql:/var/lib/postgresql/data'
      - './docker/postgres/init:/docker-entrypoint-initdb.d:ro'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-sail} -d postgres']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      shared-services:
        aliases:
          - pgsql

  redis:
    profiles:
      - shared
    image: redis:7-alpine
    restart: unless-stopped
    container_name: '${SHARED_REDIS_CONTAINER:-agent-ready-laravel-redis}'
    ports:
      - '${FORWARD_REDIS_PORT:-63790}:6379'
    volumes:
      - 'shared-redis:/data'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      shared-services:
        aliases:
          - redis

  mailpit:
    profiles:
      - shared
    image: axllent/mailpit:latest
    restart: unless-stopped
    container_name: '${SHARED_MAILPIT_CONTAINER:-agent-ready-laravel-mailpit}'
    ports:
      - '${FORWARD_MAILPIT_SMTP_PORT:-10250}:1025'
      - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
    networks:
      shared-services:
        aliases:
          - mailpit

networks:
  default:
    driver: bridge
  shared-services:
    name: '${SHARED_SERVICES_NETWORK:-agent-ready-laravel-shared}'
    external: true

volumes:
  shared-pgsql:
    name: agent-ready-laravel-pgsql-data
  shared-redis:
    name: agent-ready-laravel-redis-data
